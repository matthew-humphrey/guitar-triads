<!DOCTYPE html>
<html lang="en">
	<head>
		<meta name = "viewport" content = "width=device-width, initial-scale = 1.0">
		<title>Guitar Triads</title>
		<link rel="stylesheet" href="style.css">
		<link rel="icon" type="image/x-icon" href="resources/favicon.ico">		
	</head>
	<body>

		<div class="top-bar">
			<div class="control-panel">
				<div class="control-row">
					<div class="control-group">
						<div class="key-controls">
							<select id="keyChooser" onchange="updateScaleandTriads()">
							</select>	
							<select id="majMinChooser" onchange="updateScaleandTriads()">
								<option value=0>Major</option>
								<option value=1>Minor</option>
							</select>
						</div>
						<div class="control-label key-label">
							<span class="bracket-line">└──── key ────┘</span>
						</div>
					</div>
					<div class="control-group">
						<select id="stringSetChooser" onchange="updateScaleandTriads()">
							<option value=1>(3-2-1)</option>
							<option value=2>(4-3-2)</option>
							<option value=3>(5-4-3)</option>
							<option value=4>(6-5-4)</option>
						</select>
						<div class="control-label">strings</div>
					</div>
				</div>
				<button class="download-btn" onclick="cloneCanvas()">Download</button>
			</div>
			<div class="title-area">
				<div id="selectionSummary" aria-live="polite"></div>
			</div>
			<div class="legend" aria-label="Triad inversion legend">
				<div class="legend-item legend-root">root position (1,3,5)</div>
				<div class="legend-item legend-first">1st inversion (3,5,1)</div>
				<div class="legend-item legend-second">2nd inversion (5,1,3)</div>
			</div>
		</div>
	<div id="container">
		<canvas id="backcan" width = 2000 height = 1000></canvas>
		<canvas id="cancan" width = 2000 height = 1000></canvas>
		<canvas id="chordcan" width = 2000 height = 1000></canvas>
	</div>
	
	<footer class="footer">
		<p>Created by <a href="https://github.com/matthew-humphrey/guitar-triads" target="_blank" rel="noopener noreferrer">Matthew Humphrey</a>, 2025</p>
	</footer>
</html>

<script src="appData.js"></script>
<script src="utils.js"></script>
<script src="script.js"></script>
