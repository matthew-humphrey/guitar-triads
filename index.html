<!DOCTYPE html>
<html lang="en">
	<head>
		<meta name = "viewport" content = "width=device-width, initial-scale = 1.0">
		<title>Guitar Triads</title>
		<link rel="stylesheet" href="style.css">
		<link rel="icon" type="image/x-icon" href="resources/favicon.ico">		
	</head>
	<body>

		<div class="top-bar">
			<div class="control-panel">
				<div class="control-row">
					<div class="control-group">
						<div class="key-controls">
							<select id="keyChooser" onchange="updateScaleandTriads()">
							</select>	
							<select id="majMinChooser" onchange="updateScaleandTriads()">
								<option value=0>Major</option>
								<option value=1>Minor</option>
							</select>
						</div>
						<div class="control-label key-label">
							<span class="bracket-line">└──── key ────┘</span>
						</div>
					</div>
					<div class="control-group">
						<select id="typeChooser" onchange="updateScaleandTriads()">
						</select>
						<div class="control-label">type</div>
					</div>
					<div class="control-group">
						<select id="stringSetChooser" onchange="updateScaleandTriads()">
						</select>
						<div class="control-label">strings</div>
					</div>
					<div class="control-group">
						<select id="tuningChooser" onchange="updateScaleandTriads()">
						</select>
						<div class="control-label">tuning</div>
					</div>
				</div>
				<button class="download-btn" onclick="download()">Download</button>
			</div>
			<div class="legend" aria-label="Triad inversion legend">
				<div class="legend-item legend-root">root position</div>
				<div class="legend-item legend-first">1st inversion</div>
				<div class="legend-item legend-second">2nd inversion</div>
			</div>
		</div>
	<div id="container">
		<canvas id="backcan" width = 2000 height = 1000></canvas>
		<canvas id="cancan" width = 2000 height = 1000></canvas>
		<canvas id="chordcan" width = 2000 height = 1000></canvas>
	</div>
	
	<footer class="footer">
		<p>Created by <a href="https://github.com/matthew-humphrey/guitar-triads" target="_blank" rel="noopener noreferrer">Matthew Humphrey</a>, 2025</p>
	</footer>
</html>

<script src="triads.js"></script>
<script src="fretboard.js"></script>
<script src="script.js"></script>
